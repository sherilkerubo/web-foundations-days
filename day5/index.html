<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - Users & REST API Design</title>
  <script src="users.js" defer></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #333;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: center;
    }
    input[type="text"] {
      padding: 0.5rem;
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    #status {
      font-weight: 600;
      min-height: 1.2em;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li.user-card {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      background-color: #f9f9f9;
    }
    .user-name {
      margin: 0 0 0.25rem 0;
      color: #1a0dab;
    }
    .user-info {
      margin: 0.25rem 0;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users" type="button">Load Users</button>
    <div>
      <label for="filter-input">Filter by Name:</label>
      <input type="text" id="filter-input" placeholder="Type a name..." disabled>
    </div>
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>
</body>
</html>
