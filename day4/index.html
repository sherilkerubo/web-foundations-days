<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>QuickNotes Editor</h1>
      <button id="theme-toggle" type="button">Dark mode</button>
    </header>

    <div class="editor-group">
      <label for="note-text">Your Note</label>
      <textarea id="note-text" placeholder="Type your note here..."></textarea>
    </div>

    <div class="counter-group">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <div class="action-group">
      <button id="clear-btn" type="button">Clear</button>
    </div>
  </main>
</body>
</html>
